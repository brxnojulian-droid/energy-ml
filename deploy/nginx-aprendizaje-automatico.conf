# Vhost nginx para aprendizaje-automatico.iftn199.com.ar
# Ubicación en el VPS: /etc/nginx/conf.d/aprendizaje-automatico.iftn199.com.ar.conf
#
# Cloudflare opera en modo Flexible: llega al origen por HTTP:80 y marca la
# petición original con X-Forwarded-Proto. Por eso solo se define el bloque :80
# (no hace falta certificado en el origen). Mismo patrón que dev.isftn199.com.ar.

server {
    listen 80;
    listen [::]:80;
    server_name aprendizaje-automatico.iftn199.com.ar;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location ^~ /. {
        return 403;
    }

    location / {
        # Evita el bucle de redirecciones con Cloudflare Flexible: solo se
        # redirige a clientes HTTP genuinos.
        if ($http_x_forwarded_proto != "https") {
            return 301 https://aprendizaje-automatico.iftn199.com.ar$request_uri;
        }
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header Strict-Transport-Security;
        proxy_read_timeout 60s;
    }

    client_max_body_size 10m;
}
